name: Setup Housekeeper workspace
description: Install the pinned Node and pnpm toolchain and restore dependencies

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.17.1
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.18.0
        cache: pnpm

    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

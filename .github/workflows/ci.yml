name: CI

# Un solo workflow para todas las puertas de calidad. Motivo: la auditoría de
# despliegue (docs/despliegue/plan-vercel-supabase.md §12.2) encontró que 18 de
# las 27 specs de Playwright no las ejecutaba ningún workflow y que las suites de
# integración de web y worker eran inertes porque su job no levantaba Postgres.
# El gate `assert-suite-coverage.py` sólo puede comprobarlo si toda la evidencia
# JUnit se produce en la MISMA ejecución, así que las baterías de navegador
# viven aquí y no en un workflow aparte.
#
# Aislamiento de bases de datos: cada job que necesita Postgres declara su
# PROPIO contenedor de servicio. Las suites de integración crean bases y roles
# de nombre fijo (casaclara_access_it, it_casa_clara_app_login…) y se pisarían
# entre sí sobre un clúster compartido; con un servicio por job cada una tiene
# su clúster. Dentro de un job las suites van en pasos SECUENCIALES, nunca en
# paralelo, por la misma razón.

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: Europe/Madrid

jobs:
  static-analysis:
    name: Lint, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Enforce Today bundle and fixture-leak budgets
        run: pnpm --filter @casa-clara/web verify:bundle

  unit:
    name: Unit and domain tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # SIN base de datos a propósito. `pnpm test:unit` es `pnpm -r test`, que
    # ejecuta los workspaces en PARALELO; darle Postgres pondría a las suites de
    # integración de server y web a recrear el esquema de la misma base a la vez.
    # Su sitio es el job `integration`, que las corre una detrás de otra.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run a non-empty unit suite
        run: scripts/ci/run-tests-nonempty.sh pnpm test:unit
      - name: Run the preserved prototype suite
        # tests/*.test.mjs (node:test) valida logic.js/data.js/server.mjs del
        # prototipo conservado en la raíz. No lo recogía ningún job porque la
        # raíz no es un paquete del workspace y `pnpm -r` no la visita.
        run: scripts/ci/run-tests-nonempty.sh pnpm test:legacy
      - name: Assert JUnit unit evidence is non-empty
        run: python3 scripts/ci/assert-junit-nonempty.py 'artifacts/unit/*.xml'
      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: |
            artifacts/unit
            coverage
          if-no-files-found: ignore

  compose:
    name: Compose contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate local and staging Compose models
        run: scripts/ci/validate-compose.sh

  database:
    name: Database migrations and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: casaclara_ci_db
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d casaclara_ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci_admin:ci-only-password@127.0.0.1:5432/casaclara_ci_db
      TEST_DATABASE_URL: postgresql://ci_admin:ci-only-password@127.0.0.1:5432/casaclara_ci_db
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply migrations from an empty database
        run: pnpm db:migrate
      - name: Run database invariants
        run: scripts/ci/run-tests-nonempty.sh pnpm test:db
      - name: Run negative RLS matrix
        run: scripts/ci/run-tests-nonempty.sh pnpm test:rls
      - name: Run wiki importer round-trip
        run: scripts/ci/run-tests-nonempty.sh pnpm test:import
      - name: Reapply migrations to prove idempotent runner behavior
        run: pnpm db:migrate
      # El job de arriba corre con un propietario superusuario, así que por sí solo
      # no volvería a detectar los bloqueantes de Postgres gestionado. La sonda
      # instala el esquema entero otra vez sobre una base desechable con un rol
      # NOSUPERUSER + NOBYPASSRLS y las extensiones fuera de `public`.
      - name: Reproduce a Supabase-shaped install from scratch
        env:
          PROBE_ADMIN_URL: postgresql://ci_admin:ci-only-password@127.0.0.1:5432/casaclara_ci
        run: pnpm --filter @casa-clara/db probe:supabase

  integration:
    name: Server, web and worker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: casaclara_ci_integration
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d casaclara_ci_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Clúster propio de este job. Las suites lo usan como login administrador:
      # recrean el esquema de esta base y CREAN bases hermanas de nombre fijo
      # (casaclara_access_it, casaclara_prune_it…). Por eso necesita permisos de
      # creación de bases y por eso los pasos van en secuencia.
      TEST_DATABASE_URL: postgresql://ci_admin:ci-only-password@127.0.0.1:5432/casaclara_ci_integration
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run server transaction, RLS and idempotency integration
        run: scripts/ci/run-tests-nonempty.sh pnpm --filter @casa-clara/server test
      - name: Run web server-side integration against Postgres
        # Antes corría en el job `unit`, sin Postgres: las 14 suites de
        # integración quedaban saltadas y nadie lo notaba.
        run: scripts/ci/run-tests-nonempty.sh pnpm --filter @casa-clara/web test
      - name: Run worker integration against Postgres
        # apps/worker no tiene vitest.config.ts, así que el JUnit se pide por
        # línea de órdenes en vez de tocar el paquete.
        run: >-
          scripts/ci/run-tests-nonempty.sh
          pnpm --filter @casa-clara/worker exec vitest run
          --reporter=default --reporter=junit
          --outputFile.junit=../../artifacts/unit/worker.xml
      - name: Assert JUnit integration evidence is non-empty
        run: python3 scripts/ci/assert-junit-nonempty.py 'artifacts/unit/*.xml'
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: artifacts/unit
          if-no-files-found: error

  e2e-fixture:
    name: E2E and axe (fixture mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALLOW_SYNTHETIC_DATA_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Chromium runtime
        # El paquete @playwright/test es devDependency de apps/web, no de la
        # raíz: `pnpm exec playwright` desde la raíz falla con «Command not found».
        run: pnpm --filter @casa-clara/web exec playwright install --with-deps chromium
      - name: Run non-empty browser suite
        run: scripts/ci/run-tests-nonempty.sh pnpm test:e2e
      - name: Run non-empty axe suite
        run: scripts/ci/run-tests-nonempty.sh pnpm test:a11y
      - name: Assert JUnit e2e evidence is non-empty
        run: python3 scripts/ci/assert-junit-nonempty.py 'artifacts/e2e/*.xml'
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fixture-results
          path: |
            artifacts/e2e
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  e2e-database:
    name: E2E acceptance under real RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: casaclara_ci_e2e
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d casaclara_ci_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Las 18 specs *.dbe2e.ts: la batería de aceptación de los cinco roles
      # contra Postgres real. El globalSetup recrea el esquema, aplica fixtures
      # y crea el login NOBYPASSRLS con el que arranca el servidor web.
      E2E_DATABASE_URL: postgresql://ci_admin:ci-only-password@127.0.0.1:5432/casaclara_ci_e2e
      ALLOW_SYNTHETIC_DATA_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Chromium runtime
        # El paquete @playwright/test es devDependency de apps/web, no de la
        # raíz: `pnpm exec playwright` desde la raíz falla con «Command not found».
        run: pnpm --filter @casa-clara/web exec playwright install --with-deps chromium
      - name: Run the role acceptance battery against Postgres
        run: scripts/ci/run-tests-nonempty.sh pnpm test:e2e:db
      - name: Assert JUnit database e2e evidence is non-empty
        run: python3 scripts/ci/assert-junit-nonempty.py 'artifacts/e2e/junit-db.xml'
      - name: Upload database e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-database-results
          path: |
            artifacts/e2e
            apps/web/test-results
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ALLOW_SYNTHETIC_DATA_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Chromium runtime
        # El paquete @playwright/test es devDependency de apps/web, no de la
        # raíz: `pnpm exec playwright` desde la raíz falla con «Command not found».
        run: pnpm --filter @casa-clara/web exec playwright install --with-deps chromium
      - name: Enforce brief performance budgets
        run: pnpm test:lighthouse -- --config=infra/quality/lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: artifacts/lighthouse
          if-no-files-found: error

  suite-coverage:
    name: No spec file may go unexecuted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [unit, integration, e2e-fixture, e2e-database]
    steps:
      - uses: actions/checkout@v4
      - name: Collect every JUnit report produced by this run
        uses: actions/download-artifact@v4
        with:
          path: evidence
          pattern: "*-results"
      - name: Show what was collected
        run: find evidence -name '*.xml' | sort
      - name: Every Playwright spec on disk must have run
        # 27 ficheros: 8 *.e2e.ts + 18 *.dbe2e.ts + 1 *.a11y.ts. Los nombres de
        # `testsuite` de Playwright son relativos a testDir (apps/web/e2e).
        run: >-
          python3 scripts/ci/assert-suite-coverage.py
          --label 'specs de Playwright'
          --specs 'apps/web/e2e::*.e2e.ts'
          --specs 'apps/web/e2e::*.dbe2e.ts'
          --specs 'apps/web/e2e::*.a11y.ts'
          --junit 'evidence/**/*.xml'
      - name: Every Vitest file of web, server and worker must have run
        # Cubre de paso el segundo hueco de la auditoría: una suite de
        # integración con TODOS sus casos saltados cuenta como no ejecutada.
        #
        # Quedan fuera del inventario `packages/{domain,contracts,db}`: no
        # emiten JUnit y, sobre todo, no lo necesitan — no dependen de ningún
        # entorno y `pnpm -r test` descubre cualquier fichero nuevo por sí solo,
        # así que no pueden caer en el fallo que este gate persigue. Los cubren
        # `run-tests-nonempty.sh` en los jobs `unit` y `database`. Si algún día
        # una de esas suites pasa a depender de un servicio externo, hay que
        # darle JUnit y meterla aquí.
        run: >-
          python3 scripts/ci/assert-suite-coverage.py
          --label 'suites de Vitest con servidor o base de datos'
          --specs 'apps/web::tests/*.test.ts'
          --specs 'packages/server::src/*.test.ts'
          --specs 'apps/worker::src/*.test.ts'
          --junit 'evidence/**/*.xml'

  deployable:
    name: Deployment gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # ESTE es el job que bloquea un despliegue. Si está en verde, las diez
    # puertas de calidad del contrato de entrega han corrido de verdad en esta
    # revisión. Protege `main` exigiendo únicamente este check.
    needs:
      - static-analysis
      - unit
      - compose
      - database
      - integration
      - e2e-fixture
      - e2e-database
      - lighthouse
      - suite-coverage
    if: always()
    steps:
      - name: Refuse to pass unless every gate succeeded
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${GATE_RESULTS}"
          failed=$(printf '%s' "${GATE_RESULTS}" | jq -r 'to_entries | map(select(.value.result != "success") | .key) | join(" ")')
          if [ -n "${failed}" ]; then
            echo "Despliegue bloqueado; puertas no superadas: ${failed}" >&2
            exit 1
          fi
          echo "Todas las puertas en verde: la revisión es desplegable."

name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: Europe/Madrid

jobs:
  static-analysis:
    name: Lint, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Enforce Today bundle and fixture-leak budgets
        run: pnpm --filter @casa-clara/web verify:bundle

  unit:
    name: Unit and domain tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run a non-empty unit suite
        run: scripts/ci/run-tests-nonempty.sh pnpm test:unit
      - name: Assert JUnit unit evidence is non-empty
        run: python3 scripts/ci/assert-junit-nonempty.py 'artifacts/unit/*.xml'
      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: |
            artifacts/unit
            coverage
          if-no-files-found: ignore

  compose:
    name: Compose contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate local and staging Compose models
        run: scripts/ci/validate-compose.sh

  database:
    name: Database migrations and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: casaclara_ci
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d casaclara_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci_admin:ci-only-password@127.0.0.1:5432/casaclara_ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-only-password@127.0.0.1:5432/casaclara_ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply migrations from an empty database
        run: pnpm db:migrate
      - name: Run database invariants
        run: scripts/ci/run-tests-nonempty.sh pnpm test:db
      - name: Run negative RLS matrix
        run: scripts/ci/run-tests-nonempty.sh pnpm test:rls
      - name: Run server transaction and idempotency integration
        run: scripts/ci/run-tests-nonempty.sh pnpm --filter @casa-clara/server test
      - name: Assert JUnit integration evidence is non-empty
        run: python3 scripts/ci/assert-junit-nonempty.py 'artifacts/unit/*.xml'
      - name: Run wiki importer round-trip
        run: scripts/ci/run-tests-nonempty.sh pnpm --filter @casa-clara/db test:import
      - name: Reapply migrations to prove idempotent runner behavior
        run: pnpm db:migrate
      # El job de arriba corre con un propietario superusuario, así que por sí solo
      # no volvería a detectar los bloqueantes de Postgres gestionado. La sonda
      # instala el esquema entero otra vez sobre una base desechable con un rol
      # NOSUPERUSER + NOBYPASSRLS y las extensiones fuera de `public`.
      - name: Reproduce a Supabase-shaped install from scratch
        env:
          PROBE_ADMIN_URL: postgresql://ci_admin:ci-only-password@127.0.0.1:5432/casaclara_ci
        run: pnpm --filter @casa-clara/db probe:supabase

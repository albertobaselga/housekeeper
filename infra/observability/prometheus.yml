global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: housekeeper-web
    metrics_path: /api/metrics
    static_configs:
      - targets: ["web:3000"]

  - job_name: housekeeper-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:3001"]
